# Default model prices for `wf report` cost, in US dollars per million tokens.
#
# A model is matched by the longest key its id starts with, so a dated id (claude-opus-4-6-20260101) finds its family.
# input and output are the vendor's list prices on the first-party API as of 2026-09-25. cacheRead is listed where the
# vendor states it; elsewhere it is derived as 0.1 x input. cacheWrite is derived as 1.25 x input (the 5-minute cache
# write rate). Partner platforms (cloud marketplaces) price differently.
#
# Override any of it per user in ~/.config/agentic-workflow/prices.yaml (or $WF_CONFIG_HOME/prices.yaml) and per
# project in .workflow/prices.yaml (the project file wins). Same shape: `models: { <id prefix>: { input, output,
# cacheRead, cacheWrite } }`. A model with no entry has no cost: the report lists it under `unpricedModels`.
currency: USD
per: 1000000
asOf: 2026-09-25
models:
  claude-fable-5-1: { input: 10, output: 50, cacheRead: 0.25, cacheWrite: 12.5 }
  claude-fable-5: { input: 10, output: 50, cacheRead: 1, cacheWrite: 12.5 }
  claude-opus-5-5: { input: 4, output: 20, cacheRead: 0.2, cacheWrite: 5 }
  claude-opus-5: { input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25 }
  claude-opus-4-8: { input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25 }
  claude-opus-4-7: { input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25 }
  claude-opus-4-6: { input: 5, output: 25, cacheRead: 0.5, cacheWrite: 6.25 }
  claude-sonnet-5-5: { input: 2, output: 10, cacheRead: 0.2, cacheWrite: 2.5 }
  claude-sonnet-5: { input: 2, output: 10, cacheRead: 0.2, cacheWrite: 2.5 }
  claude-sonnet-4-6: { input: 3, output: 15, cacheRead: 0.3, cacheWrite: 3.75 }
  claude-haiku-4-5: { input: 1, output: 5, cacheRead: 0.1, cacheWrite: 1.25 }
