# Default model and effort per role and harness. The project definition and ~/.agents/workflow.yaml override these;
# a role or field left out falls through to the next source, and in the end to the session's own model.
# A checker runs at a higher effort than the author it checks. Codex models are left to the session.
roles:
  claude:
    discover:    { model: opus,   effort: high }
    shape:       { model: opus,   effort: high }
    design:      { model: opus,   effort: high }
    challenge:   { model: opus,   effort: xhigh }
    confirm:     { model: opus,   effort: high }
    decide:      { model: opus,   effort: high }
    reconsider:  { model: opus,   effort: xhigh }
    triage:      { model: opus,   effort: high }
    build:       { model: sonnet, effort: medium }
    verify:      { model: opus,   effort: high }
    verify-direct: { model: sonnet, effort: high }
    read:        { model: sonnet, effort: high }
    deliver:     { model: sonnet, effort: medium }
    audit:       { model: sonnet, effort: high }
  codex:
    discover:    { effort: high }
    shape:       { effort: high }
    design:      { effort: high }
    challenge:   { effort: xhigh }
    confirm:     { effort: high }
    decide:      { effort: high }
    reconsider:  { effort: xhigh }
    triage:      { effort: high }
    build:       { effort: medium }
    verify:      { effort: high }
    verify-direct: { effort: medium }
    read:        { effort: high }
    deliver:     { effort: medium }
    audit:       { effort: high }
