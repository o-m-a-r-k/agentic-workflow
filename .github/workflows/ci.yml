name: scenarios

# A release runs once, by hand on its release branch (`gh workflow run scenarios --ref release/X`); main is then
# fast-forwarded to that commit, which the pre-push hook checks passed (scripts/ci-passed.mjs). A run on the push to main
# would test the same commit again.
on:
  pull_request:
  # Weekly, so drift in the runners or Node is caught without a push.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: scenarios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenarios:
    strategy:
      fail-fast: false
      # Each OS runs the suite in shards, one job each: Node's `--test-shard=<i>/<n>` gives shard i every n-th scenario file in
      # sorted order, so every file runs in exactly one shard of each OS and nothing is dropped. Named cost: one macOS job
      # grew from 23 to past 30 minutes (about 5,200 seconds of tests at three files at a time), so the run's limit was raised
      # to 45 minutes; one Linux job took 16. Per-file times measured on the last runs put the macOS shards at 8 to 13
      # minutes and the Linux shards near 8. A file that grows past the others (about 4 minutes today) is split over a shared fixtures module, as
      # CONTRIBUTING.md says, rather than by adding shards.
      matrix:
        include:
          - { os: macos-latest, shard: 1/3 }
          - { os: macos-latest, shard: 2/3 }
          - { os: macos-latest, shard: 3/3 }
          - { os: ubuntu-latest, shard: 1/2 }
          - { os: ubuntu-latest, shard: 2/2 }
    name: scenarios (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # A hung scenario fails its shard in 30 minutes (about three times a shard's run) instead of holding a runner for
    # GitHub's six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: git identity for the scenario repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.test
          git config --global init.defaultBranch main
      # One file per core of the macOS runner (3). Files ran one at a time after competing Git-heavy fixtures exhausted the
      # stop scenario's fixed 20-second deadline; that deadline is 60 seconds since 0.7.0. A test that needs more time under
      # load gets headroom, never a serial suite.
      - name: scenarios on macOS
        if: runner.os == 'macOS'
        run: node --test --test-reporter=spec --test-concurrency=3 --test-shard=${{ matrix.shard }} scenarios/*.test.mjs
      - name: scenarios on Linux
        if: runner.os != 'macOS'
        run: node --test --test-reporter=spec --test-shard=${{ matrix.shard }} scenarios/*.test.mjs
