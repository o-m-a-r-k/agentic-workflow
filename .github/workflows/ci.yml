name: scenarios

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so drift in the runners or Node is caught without a push.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: scenarios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenarios:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: git identity for the scenario repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.test
          git config --global init.defaultBranch main
      # One file per core of the macOS runner (3). Files ran one at a time after competing Git-heavy fixtures exhausted the
      # stop scenario's fixed 20-second deadline; that deadline is 60 seconds since 0.7.0, and serial runs took about 30
      # minutes against Linux's 9. A test that needs more time under load gets headroom, never a serial suite.
      - name: scenarios on macOS
        if: runner.os == 'macOS'
        run: node --test --test-reporter=spec --test-concurrency=3 scenarios/*.test.mjs
      - name: scenarios on Linux
        if: runner.os != 'macOS'
        run: node --test --test-reporter=spec scenarios/*.test.mjs
