name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: manifests and skill frontmatter
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          bad = []
          names = set()
          for p in ['plugin.json', '.claude-plugin/plugin.json', '.claude-plugin/marketplace.json', 'skills/deliver/templates/CHECKS.json']:
              try:
                  data = json.loads(pathlib.Path(p).read_text())
              except Exception as e:
                  bad.append(f'{p}: {e}'); continue
              if p.endswith('plugin.json'):
                  names.add((data.get('name'), data.get('version')))
          if len(names) != 1:
              bad.append(f'plugin.json and .claude-plugin/plugin.json disagree on name or version: {sorted(map(str, names))}')
          for skill in sorted(pathlib.Path('skills').glob('*/SKILL.md')):
              m = re.match(r'---\n(.*?)\n---\n', skill.read_text(), re.S)
              fields = dict(l.split(':', 1) for l in m.group(1).splitlines() if ':' in l) if m else {}
              if fields.get('name', '').strip() != skill.parent.name or not fields.get('description', '').strip():
                  bad.append(f'{skill}: frontmatter needs name ({skill.parent.name}) and description')
          print('\n'.join(bad) or 'manifests and skills ok')
          sys.exit(1 if bad else 0)
          PY

      - name: claude plugin validate
        run: |
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.303
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json

      # The denylist is a repository secret: one word or /regular expression/ per line, case-insensitive, # for comments.
      # Hits are reported by file, line and pattern number, never by the matched text.
      - name: privacy
        env:
          DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then
            echo "::notice::PRIVACY_DENYLIST is not set; the privacy check was skipped"
            exit 0
          fi
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist"
          python3 - "$RUNNER_TEMP/denylist" <<'PY'
          import re, subprocess, sys
          pats = []
          for line in open(sys.argv[1], encoding='utf-8'):
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              m = re.fullmatch(r'/(.+)/', line)
              pats.append(re.compile(m.group(1) if m else r'\b' + re.escape(line) + r'\b', re.I))
          hits = 0
          for path in subprocess.run(['git', 'ls-files', '-z'], capture_output=True, text=True, check=True).stdout.split('\0'):
              if not path:
                  continue
              try:
                  text = open(path, encoding='utf-8').read()
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              for n, line in enumerate([path] + text.splitlines()):
                  for i, p in enumerate(pats, 1):
                      if p.search(line):
                          hits += 1
                          print(f'{path}:{n if n else "(path)"}: matches pattern {i}')
          print(f'{len(pats)} patterns, {hits} hits')
          sys.exit(1 if hits else 0)
          PY
