name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: manifests and skill frontmatter
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          bad = []
          names = set()
          for p in ['plugin.json', '.claude-plugin/plugin.json', '.claude-plugin/marketplace.json', 'skills/deliver/templates/CHECKS.json']:
              try:
                  data = json.loads(pathlib.Path(p).read_text())
              except Exception as e:
                  bad.append(f'{p}: {e}'); continue
              if p.endswith('plugin.json'):
                  names.add((data.get('name'), data.get('version')))
          if len(names) != 1:
              bad.append(f'plugin.json and .claude-plugin/plugin.json disagree on name or version: {sorted(map(str, names))}')
          for skill in sorted(pathlib.Path('skills').glob('*/SKILL.md')):
              m = re.match(r'---\n(.*?)\n---\n', skill.read_text(), re.S)
              fields = dict(l.split(':', 1) for l in m.group(1).splitlines() if ':' in l) if m else {}
              if fields.get('name', '').strip() != skill.parent.name or not fields.get('description', '').strip():
                  bad.append(f'{skill}: frontmatter needs name ({skill.parent.name}) and description')
          print('\n'.join(bad) or 'manifests and skills ok')
          sys.exit(1 if bad else 0)
          PY

      - name: claude plugin validate
        run: |
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.303
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json
