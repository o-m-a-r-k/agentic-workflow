name: Bug report
description: The plugin does not install, load or read its files as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include the command or request and what the agent did. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Environment, description: "Plugin version, harness and its version, OS" }
