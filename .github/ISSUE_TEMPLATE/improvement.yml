name: Method improvement
description: Agents following the method went wrong or wasted effort
labels: [improvement]
body:
  - type: markdown
    attributes:
      value: "Leave out project, company and person names, ticket ids, paths, emails and URLs."
  - type: textarea
    id: failure
    attributes: { label: What went wrong, description: "The step and role, what the agent did, and what it cost." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What should have happened }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Plugin version }
