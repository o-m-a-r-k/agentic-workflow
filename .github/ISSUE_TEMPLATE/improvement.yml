name: Workflow improvement
description: Something in the workflow itself went wrong or wasted time (the engine, a role text, a skill, tracker handling, onboarding, docs)
labels: [improvement]
body:
  - type: markdown
    attributes:
      value: "Leave out project, company and person names, ticket ids, paths, emails and URLs. If a `wf report` metric shows it, name the metric."
  - type: dropdown
    id: class
    attributes:
      label: Class
      options: [engine, text, skill, tracker, delivery, onboarding, docs, other]
    validations: { required: true }
  - type: textarea
    id: failure
    attributes: { label: What went wrong, description: "The step or command, what happened and what it cost (a lost round, a wrong refusal, a missed check)." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What should have happened }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Plugin version, description: "`wf --version`" }
