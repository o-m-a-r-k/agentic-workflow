<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<style>
  svg { --fg: #d6dde4; --cmd: #ffffff; --note: #7f8b96; --good: #6fcf97; --bad: #ff7b72; }
  .t { font: 600 64px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
  .s { font: 28px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b8c2cc; }
  .m { font: 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
</style>
<rect width="1280" height="640" fill="#0f1419"/>
<text class="t" x="80" y="150">agentic-workflow</text>
<text class="s" x="80" y="205">Your agent says the tests passed. wf makes it prove it.</text>
<text class="s" x="80" y="245">Frozen criteria, a gate on the exact tree, an independent review, a verified handoff.</text>
<rect x="80" y="290" width="1120" height="274" rx="10" fill="#1c232b"/>
<text class="m" x="108" y="330" fill="var(--cmd)">$ wf gate --attempt HT-1.1</text>
<text class="m" x="108" y="364" fill="var(--bad)">wf gate: failed   unit  0.1s</text>
<text class="m" x="108" y="398" fill="var(--bad)">(exit 1: refused)</text>
<text class="m" x="108" y="432" fill="var(--cmd)">$ wf handoff reviewer --agent implementer-1 --attempt HT-1.1</text>
<text class="m" x="108" y="466" fill="var(--bad)">wf handoff: implementer-1 planned, wrote or owns this change and cannot review it</text>
<text class="m" x="108" y="500" fill="var(--good)">delivered HT-1.1: hello-ticket@1a648857d2</text>
<text class="m" x="108" y="534" fill="var(--good)">tracker: delivered performed on the ticket files and read back; attempt closed</text>
</svg>
